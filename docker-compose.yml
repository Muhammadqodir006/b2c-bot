services:
  postgres:
    image: postgres:16
    container_name: salon-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: salon_user
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: salon_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: